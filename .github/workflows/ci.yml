name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build + Test (runs on push to main/develop and PRs to main)
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  # ---------------------------------------------------------------------------
  # Job 2: Cross-compile release binaries (runs on tag push v*)
  # ---------------------------------------------------------------------------
  release:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            name: linux-x86_64
            deb_arch: amd64
          - target: aarch64-linux-musl
            name: linux-aarch64
            deb_arch: arm64
          - target: x86_64-macos
            name: macos-x86_64
          - target: aarch64-macos
            name: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ZON_VERSION=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          if [ "$TAG_VERSION" != "$ZON_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but build.zig.zon has ${ZON_VERSION}"
            exit 1
          fi
          echo "Version verified: ${TAG_VERSION}"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Rename binary
        run: mv zig-out/bin/pls pls-${{ matrix.name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pls-${{ matrix.name }}
          path: pls-${{ matrix.name }}

      - name: Build .deb package
        if: matrix.deb_arch
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/usr/local/bin pkg/DEBIAN
          cp pls-${{ matrix.name }} pkg/usr/local/bin/pls
          chmod +x pkg/usr/local/bin/pls
          cat > pkg/DEBIAN/control << EOF
          Package: pls
          Version: ${VERSION}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Seokjun Kim
          Description: AI-powered CLI assistant
          Homepage: https://github.com/colus001/pls
          EOF
          sed -i 's/^          //' pkg/DEBIAN/control
          dpkg-deb --build pkg "pls_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Upload .deb artifact
        if: matrix.deb_arch
        uses: actions/upload-artifact@v4
        with:
          name: pls_${{ matrix.deb_arch }}.deb
          path: "*.deb"

  # ---------------------------------------------------------------------------
  # Job 3: Create GitHub Release with all binaries attached
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  # ---------------------------------------------------------------------------
  # Job 4: Update Homebrew tap formula
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Update Homebrew Formula
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "pls-*"
          merge-multiple: true

      - name: Generate formula and push to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GH_REF_NAME#v}"
          BASE_URL="https://github.com/colus001/pls/releases/download/${GH_REF_NAME}"

          SHA_MACOS_ARM=$(sha256sum artifacts/pls-macos-aarch64 | cut -d' ' -f1)
          SHA_MACOS_X86=$(sha256sum artifacts/pls-macos-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum artifacts/pls-linux-aarch64 | cut -d' ' -f1)
          SHA_LINUX_X86=$(sha256sum artifacts/pls-linux-x86_64 | cut -d' ' -f1)

          mkdir -p tap/Formula

          cat > tap/Formula/pls.rb << FORMULA
          class Pls < Formula
            desc "AI-powered CLI assistant"
            homepage "https://github.com/colus001/pls"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/pls-macos-aarch64"
                sha256 "${SHA_MACOS_ARM}"
              else
                url "${BASE_URL}/pls-macos-x86_64"
                sha256 "${SHA_MACOS_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/pls-linux-aarch64"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "${BASE_URL}/pls-linux-x86_64"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install Dir["pls-*"].first => "pls"
            end

            def caveats
              <<~EOS
                pls works out of the box with the free tier (no API key needed).

                To get started:
                  pls 'hello world'

                To use your own API key for unlimited usage:
                  pls init
              EOS
            end

            test do
              assert_match "pls v#{version}", shell_output("#{bin}/pls --version")
            end
          end
          FORMULA

          sed -i 's/^          //' tap/Formula/pls.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/colus001/homebrew-tap.git" repo
          mkdir -p repo/Formula
          cp tap/Formula/pls.rb repo/Formula/pls.rb
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pls.rb
          git diff --cached --quiet && echo "Formula unchanged" && exit 0
          git commit -m "Update pls to ${VERSION}"
          git push origin main
